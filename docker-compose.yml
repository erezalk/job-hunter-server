services:
  postgres:
    image: postgres:17-alpine
    container_name: job-hunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_hunter
      POSTGRES_USER: job_hunter
      POSTGRES_PASSWORD: job_hunter
    ports:
      # Published on localhost only, not on every network interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - job-hunter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunter -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job-hunter-postgres-data:
